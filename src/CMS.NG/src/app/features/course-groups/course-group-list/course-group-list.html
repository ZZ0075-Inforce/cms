<div class="page-header">
  <div class="titles">
    <h1>課程群組 CourseGroup</h1>
    <span class="subtitle">課程的分類群組</span>
  </div>

  <div class="actions">
    <p-button
      label="搜尋條件"
      icon="pi pi-filter"
      severity="secondary"
      [outlined]="true"
      [badge]="hasActiveFilters ? '!' : undefined"
      (onClick)="filterDrawerVisible.set(true)" />

    <p-button
      label="新增"
      icon="pi pi-plus"
      severity="success"
      routerLink="/course-groups/new" />
  </div>
</div>

<div class="table-card">
  <p-table
    [value]="groups()"
    [loading]="loading()"
    dataKey="pkid"
    [paginator]="true"
    [rows]="page.rows"
    [first]="page.first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [sortField]="sort.sortField"
    [sortOrder]="sort.sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    paginatorPosition="top"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [showCurrentPageReport]="true"
    styleClass="p-datatable-sm p-datatable-gridlines">

    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="description">群組名稱 <p-sortIcon field="description" /></th>
        <th pSortableColumn="courseCount" style="width: 8rem">對應課程數 <p-sortIcon field="courseCount" /></th>
        <th style="width: 10rem">操作</th>
      </tr>
    </ng-template>

    <ng-template #body let-group>
      <tr>
        <td>{{ group.pkid }}</td>
        <td class="cell-strong">{{ group.description }}</td>
        <td class="cell-number">{{ group.courseCount }}</td>
        <td>
          <div class="row-actions">
            <p-button
              icon="pi pi-eye"
              severity="secondary"
              [text]="true"
              [rounded]="true"
              pTooltip="檢視"
              [attr.aria-label]="'檢視 ' + group.description"
              (onClick)="view(group)" />
            <p-button
              icon="pi pi-pencil"
              severity="info"
              [text]="true"
              [rounded]="true"
              pTooltip="編輯"
              [attr.aria-label]="'編輯 ' + group.description"
              (onClick)="edit(group)" />
            <p-button
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              [rounded]="true"
              pTooltip="刪除"
              [attr.aria-label]="'刪除 ' + group.description"
              (onClick)="confirmDelete(group)" />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4" class="empty">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer
  [(visible)]="filterDrawerVisible"
  header="搜尋條件"
  position="right"
  styleClass="filter-drawer">

  <div class="filter-field">
    <label for="filter-keyword">關鍵字</label>
    <input
      pInputText
      id="filter-keyword"
      type="text"
      placeholder="群組名稱"
      [(ngModel)]="draftFilters.keyword"
      (keyup.enter)="applyFilters()" />
  </div>

  <div class="filter-actions">
    <p-button label="清除" icon="pi pi-times" severity="secondary" [outlined]="true" (onClick)="clearFilters()" />
    <p-button label="搜尋" icon="pi pi-search" (onClick)="applyFilters()" />
  </div>
</p-drawer>
