@if (loading()) {
  <div class="state">載入中…</div>
} @else if (notFound()) {
  <div class="state">
    <p>找不到這個課程群組。</p>
    <p-button label="回到清單" icon="pi pi-arrow-left" routerLink="/course-groups" />
  </div>
} @else if (group(); as item) {
  <div class="page-header">
    <div class="titles">
      <h1>檢視課程群組</h1>
      <span class="subtitle">{{ item.description }}</span>
    </div>

    <div class="actions">
      <p-button
        label="回到清單"
        icon="pi pi-arrow-left"
        severity="secondary"
        [outlined]="true"
        routerLink="/course-groups" />
      <p-button
        label="編輯"
        icon="pi pi-pencil"
        [routerLink]="['/course-groups', item.pkid, 'edit']" />
      <p-button
        label="刪除"
        icon="pi pi-trash"
        severity="danger"
        [outlined]="true"
        (onClick)="confirmDelete()" />
    </div>
  </div>

  <section class="card">
    <h2>群組資料</h2>

    <dl class="detail-grid">
      <dt>主代碼</dt>
      <dd>{{ item.pkid }}</dd>

      <dt>群組名稱</dt>
      <dd class="strong">{{ item.description }}</dd>

      <dt>對應課程數</dt>
      <dd>{{ item.courseCount }}</dd>
    </dl>
  </section>
}
