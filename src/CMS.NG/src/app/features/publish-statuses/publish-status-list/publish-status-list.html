<div class="page-header">
  <div class="titles">
    <h1>上架狀態 PublishStatus</h1>
    <span class="subtitle">課程的上架狀態主檔</span>
  </div>

  <div class="actions">
    <p-button
      label="搜尋條件"
      icon="pi pi-filter"
      severity="secondary"
      [outlined]="true"
      [badge]="hasActiveFilters ? '!' : undefined"
      (onClick)="filterDrawerVisible.set(true)" />

    <p-button
      label="新增"
      icon="pi pi-plus"
      severity="success"
      routerLink="/publish-statuses/new" />
  </div>
</div>

<div class="table-card">
  <p-table
    [value]="statuses()"
    [loading]="loading()"
    dataKey="pkid"
    [paginator]="true"
    [rows]="page.rows"
    [first]="page.first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [sortField]="sort.sortField"
    [sortOrder]="sort.sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    paginatorPosition="top"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [showCurrentPageReport]="true"
    styleClass="p-datatable-sm p-datatable-gridlines">

    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="description">狀態說明 <p-sortIcon field="description" /></th>
        <th pSortableColumn="isDraft" style="width: 7rem">草稿 <p-sortIcon field="isDraft" /></th>
        <th pSortableColumn="isPublished" style="width: 7rem">已上架 <p-sortIcon field="isPublished" /></th>
        <th pSortableColumn="isDiscontinued" style="width: 7rem">已下架 <p-sortIcon field="isDiscontinued" /></th>
        <th pSortableColumn="courseCount" style="width: 8rem">對應課程數 <p-sortIcon field="courseCount" /></th>
        <th style="width: 10rem">操作</th>
      </tr>
    </ng-template>

    <ng-template #body let-status>
      <tr>
        <td>{{ status.pkid }}</td>
        <td class="cell-strong">{{ status.description }}</td>
        <td class="cell-flag">
          @if (status.isDraft) { <i class="pi pi-check flag-on" aria-label="是"></i> } @else { <span class="flag-off">—</span> }
        </td>
        <td class="cell-flag">
          @if (status.isPublished) { <i class="pi pi-check flag-on" aria-label="是"></i> } @else { <span class="flag-off">—</span> }
        </td>
        <td class="cell-flag">
          @if (status.isDiscontinued) { <i class="pi pi-check flag-on" aria-label="是"></i> } @else { <span class="flag-off">—</span> }
        </td>
        <td class="cell-number">{{ status.courseCount }}</td>
        <td>
          <div class="row-actions">
            <p-button
              icon="pi pi-eye"
              severity="secondary"
              [text]="true"
              [rounded]="true"
              pTooltip="檢視"
              [attr.aria-label]="'檢視 ' + status.description"
              (onClick)="view(status)" />
            <p-button
              icon="pi pi-pencil"
              severity="info"
              [text]="true"
              [rounded]="true"
              pTooltip="編輯"
              [attr.aria-label]="'編輯 ' + status.description"
              (onClick)="edit(status)" />
            <p-button
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              [rounded]="true"
              pTooltip="刪除"
              [attr.aria-label]="'刪除 ' + status.description"
              (onClick)="confirmDelete(status)" />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="7" class="empty">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer
  [(visible)]="filterDrawerVisible"
  header="搜尋條件"
  position="right"
  styleClass="filter-drawer">

  <div class="filter-field">
    <label for="filter-keyword">關鍵字</label>
    <input
      pInputText
      id="filter-keyword"
      type="text"
      placeholder="狀態說明"
      [(ngModel)]="draftFilters.keyword"
      (keyup.enter)="applyFilters()" />
  </div>

  <div class="filter-field">
    <label for="filter-draft">草稿</label>
    <p-select
      inputId="filter-draft"
      [options]="triStateOptions"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      [(ngModel)]="draftFilters.isDraft" />
  </div>

  <div class="filter-field">
    <label for="filter-published">已上架</label>
    <p-select
      inputId="filter-published"
      [options]="triStateOptions"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      [(ngModel)]="draftFilters.isPublished" />
  </div>

  <div class="filter-field">
    <label for="filter-discontinued">已下架</label>
    <p-select
      inputId="filter-discontinued"
      [options]="triStateOptions"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      [(ngModel)]="draftFilters.isDiscontinued" />
  </div>

  <div class="filter-actions">
    <p-button label="清除" icon="pi pi-times" severity="secondary" [outlined]="true" (onClick)="clearFilters()" />
    <p-button label="搜尋" icon="pi pi-search" (onClick)="applyFilters()" />
  </div>
</p-drawer>
